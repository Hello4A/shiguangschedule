name: YNVCT Auto Sync Debug Build

on:
  push:
    branches:
      - ynvct-auto-sync
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode fixed test keystore
        run: |
          base64 -d .github/ynvct-debug.jks.b64 > androidApp/ynvct-debug.jks

      - name: Build debug APK
        env:
          YNVCT_KEYSTORE_PATH: ynvct-debug.jks
        run: |
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ynvct-auto-sync-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 7
